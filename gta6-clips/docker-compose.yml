services:
  clipador:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data                 # banco, vídeos e token do YouTube
      - ./config.yaml:/app/config.yaml:ro
      - ./streamers.yaml:/app/streamers.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"            # painel só no próprio servidor (use túnel SSH)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/saude', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      - PYTHONUNBUFFERED=1
      - CLIPADOR_WEB_HOST=0.0.0.0
