<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  body { width:2560px; height:1440px; position:relative;
         background: linear-gradient(180deg, #12051f 0%, #3b0a4f 34%, #a1135e 56%, #ff4f6d 68%, #ff9a3c 76%, #12051f 76.2%); }
  .sun { position:absolute; left:50%; top:470px; width:760px; height:760px; margin-left:-380px; border-radius:50%;
         background: linear-gradient(180deg, #ffd166 0%, #ff9a3c 45%, #ff2e88 100%);
         -webkit-mask: repeating-linear-gradient(180deg, #000 0 46px, transparent 46px 60px);
         mask: repeating-linear-gradient(180deg, #000 0 46px, transparent 46px 60px); opacity:.9; }
  .grid { position:absolute; left:-20%; right:-20%; top:1097px; bottom:-200px; transform-origin:top; transform:perspective(420px) rotateX(62deg);
          background-image: linear-gradient(rgba(255,46,136,.75) 3px, transparent 3px), linear-gradient(90deg, rgba(255,46,136,.75) 3px, transparent 3px);
          background-size: 120px 90px; }
  .glow { position:absolute; left:0; right:0; top:1080px; height:40px; background:linear-gradient(180deg, rgba(255,154,60,.0), rgba(255,46,136,.7), rgba(255,46,136,0)); }
  svg.palm { position:absolute; bottom:300px; fill:#0a0212; }
  .safe { position:absolute; left:507px; top:508px; width:1546px; height:423px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .word { font-size:250px; line-height:.95; }
  .sub { font-family:Bebas, sans-serif; font-size:66px; letter-spacing:.08em; color:#fff; margin-top:18px; text-shadow:0 4px 18px rgba(0,0,0,.6); }
  .tag { margin-top:14px; font-family:Bebas, sans-serif; font-size:44px; letter-spacing:.14em; color:var(--night);
         background:var(--sun); padding:4px 26px 0; transform:skewX(-8deg); }
  .stars { position:absolute; inset:0 0 60% 0; background-image:
      radial-gradient(2px 2px at 10% 20%, #fff8, transparent), radial-gradient(2px 2px at 30% 8%, #fff6, transparent),
      radial-gradient(3px 3px at 70% 14%, #fff7, transparent), radial-gradient(2px 2px at 85% 30%, #fff5, transparent),
      radial-gradient(2px 2px at 55% 5%, #fff6, transparent), radial-gradient(2px 2px at 20% 40%, #fff4, transparent); }
